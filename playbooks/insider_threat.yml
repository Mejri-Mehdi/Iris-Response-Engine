id: insider_threat
name: Insider Threat Response
description: Response to suspicious internal user activity
version: "1.0"
severity_trigger: [high, critical]

steps:
  - name: Account Suspension
    action: disable_user
    params:
      target: "{{affected_user}}"
      action: suspend

  - name: Access Log Collection
    action: collect_evidence
    params:
      type: access_logs
      target: "{{affected_user}}"


  - name: Manager Notification
    action: send_alert
    params:
      channel: email
      recipient: hr@corp.com
      message: "Insider threat alert for user {{affected_user}}"